<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCart - Fast Delivery Like Zepto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Navbar -->
    <nav class="bg-purple-700 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-2xl font-bold tracking-wide">⚡ QuickCart</h1>
        <div class="flex items-center gap-6">
            <span id="user-display" class="font-medium text-purple-200">Guest</span>
            <button onclick="toggleCart()" class="bg-yellow-400 text-gray-900 px-4 py-2 rounded-lg font-bold hover:bg-yellow-300 transition">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">10-Minute Grocery & Items</h2>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- Cart Drawer Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center border-b pb-4">
                    <h3 class="text-xl font-bold">Your Cart</h3>
                    <button onclick="toggleCart()" class="text-gray-500 hover:text-black text-2xl font-bold">&times;</button>
                </div>
                <div id="cart-items" class="mt-4 space-y-4 max-h-[60vh] overflow-y-auto"></div>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span>₹<span id="cart-total">0</span></span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                    Proceed to Order 🚀
                </button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Fresh Milk 1L", price: 66, img: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=300" },
            { id: 2, name: "Organic Bananas 1 Dozen", price: 60, img: "https://images.unsplash.com/photo-1603833665858-e61d17a86224?w=300" },
            { id: 3, name: "Whole Wheat Bread", price: 45, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300" },
            { id: 4, name: "Potato Chips 100g", price: 30, img: "https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=300" }
        ];

        let cart = JSON.parse(localStorage.getItem('quickcart_items')) || [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="bg-white p-4 rounded-xl shadow-md hover:shadow-lg transition flex flex-col justify-between">
                    <img src="${p.img}" alt="${p.name}" class="h-40 w-full object-cover rounded-md mb-4">
                    <div>
                        <h3 class="font-bold text-lg">${p.name}</h3>
                        <p class="text-gray-600 font-semibold mt-1">₹${p.price}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="mt-4 w-full bg-purple-600 text-white py-2 rounded-lg font-semibold hover:bg-purple-700 transition">
                        Add to Cart
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('quickcart_items', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const cartItems = document.getElementById('cart-items');
            const totalSpan = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-gray-500 text-center py-8">Your cart is empty!</p>`;
                totalSpan.innerText = '0';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-xs text-gray-500">₹${item.price}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 font-bold hover:text-red-700">Remove</button>
                    </div>
                `;
            }).join('');

            totalSpan.innerText = total;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function checkout() {
            if(cart.length === 0) return alert('Your cart is empty!');
            alert('🎉 Order Placed Successfully! Delivered in 10 minutes.');
            cart = [];
            saveCart();
            toggleCart();
        }

        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
